__build_info:
  rime_version: 1.16.1
  timestamps:
    default: 1792849488
    default.custom: 0
    vime_pinyin.custom: 0
    vime_pinyin.schema: 1792849488
engine:
  filters:
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
menu:
  page_size: 10
schema:
  name: "智能拼音"
  schema_id: vime_pinyin
  version: 0.14.0
speller:
  algebra:
    - "derive/^([a-z]).+$/$1/"
    - "derive/^([zcs]h).+$/$1/"
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", English]
translator:
  contextual_suggestions: true
  dictionary: vime_pinyin
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  max_sentence_length: 0