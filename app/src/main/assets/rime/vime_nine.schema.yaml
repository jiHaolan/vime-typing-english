schema:
  schema_id: vime_nine
  name: 智能九键
  version: "0.23.0"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
speller:
  alphabet: 23456789
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
translator:
  dictionary: vime_pinyin
  prism: vime_nine
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  contextual_suggestions: true
  max_sentence_length: 0
menu:
  page_size: 10
